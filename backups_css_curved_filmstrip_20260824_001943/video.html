<style id="video-page-only">

/* =========================================================
   VIDEO PAGE ONLY
   Žádný převzatý background, pseudo-icon ani otazník.
   ========================================================= */

body{
  margin:0;
  background:#01070b !important;
}

.video-stage{
  position:relative;
  min-height:720px;
  overflow:hidden;
  padding:70px 7vw;
  box-sizing:border-box;
  background:#01070b;
}

.video-content{
  position:relative;
  z-index:2;
  max-width:760px;
  margin:0 auto;
  text-align:center;
}

.video-eyebrow{
  color:#f5c542;
  font-family:Consolas,monospace;
  font-weight:800;
  letter-spacing:.16em;
  font-size:14px;
  margin-bottom:18px;
}

.video-title{
  margin:0 0 22px 0;
  color:#ffffff;
  font-family:Impact,"Arial Black",sans-serif;
  font-size:64px;
  letter-spacing:3px;
  line-height:1;
  text-shadow:0 0 18px rgba(84,216,255,.20);
}

.video-description{
  max-width:720px;
  margin:0;
  color:#c6e5f2;
  font-size:19px;
  line-height:1.65;
}

/* Pouze existující 55.png — žádný jiný symbol */

/* Výslovně žádné pseudo-elementy */


@media(max-width:900px){
  .video-stage{
    min-height:650px;
    padding:55px 30px;
  }

  .video-title{
    font-size:48px;
  }

  .video-projector{
    width:360px;
    height:360px;
    right:-70px;
    opacity:.14;
  }
}

</style>







<style id="gscx-css-filmstrip">

.video-stage{
  position:relative;
  overflow:hidden;
}

/* HLAVNÍ FILMOVÝ PÁS */
.video-stage::before{
  content:"";
  position:absolute;

  right:6vw;
  top:56%;

  width:520px;
  height:180px;

  transform:
    translateY(-50%)
    rotate(-7deg);

  border-top:2px solid rgba(35,95,105,.20);
  border-bottom:2px solid rgba(35,95,105,.20);

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 20px,
      rgba(35,95,105,.12) 20px 22px,
      transparent 22px 92px
    );

  opacity:.42;

  box-shadow:
    0 0 8px rgba(35,95,105,.025);

  pointer-events:none;
  z-index:0;
}

/* PERFORACE + DRUHÁ KŘIVKA PÁSU */
.video-stage::after{
  content:"";
  position:absolute;

  right:5vw;
  top:56%;

  width:540px;
  height:200px;

  transform:
    translateY(-50%)
    rotate(-7deg);

  background:
    repeating-linear-gradient(
      90deg,
      rgba(35,95,105,.17) 0 10px,
      transparent 10px 28px
    );

  -webkit-mask:
    linear-gradient(#000 0 0) top / 100% 12px no-repeat,
    linear-gradient(#000 0 0) bottom / 100% 12px no-repeat;

  mask:
    linear-gradient(#000 0 0) top / 100% 12px no-repeat,
    linear-gradient(#000 0 0) bottom / 100% 12px no-repeat;

  opacity:.36;

  pointer-events:none;
  z-index:0;
}

.video-content{
  position:relative;
  z-index:2;
}

.video-content::before,
.video-content::after{
  content:none !important;
  display:none !important;
}

</style>
