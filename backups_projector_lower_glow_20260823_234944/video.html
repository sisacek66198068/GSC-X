<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GSC-X Video | Command Center</title>

<link rel="stylesheet" href="style.css">

<style id="video-page-only">

/* =========================================================
   VIDEO PAGE ONLY
   Žádný převzatý background, pseudo-icon ani otazník.
   ========================================================= */

body{
  margin:0;
  background:#01070b !important;
}

.video-stage{
  position:relative;
  min-height:720px;
  overflow:hidden;
  padding:70px 7vw;
  box-sizing:border-box;
  background:#01070b;
}

.video-content{
  position:relative;
  z-index:2;
  max-width:760px;
  margin:0 auto;
  text-align:center;
}

.video-eyebrow{
  color:#f5c542;
  font-family:Consolas,monospace;
  font-weight:800;
  letter-spacing:.16em;
  font-size:14px;
  margin-bottom:18px;
}

.video-title{
  margin:0 0 22px 0;
  color:#ffffff;
  font-family:Impact,"Arial Black",sans-serif;
  font-size:64px;
  letter-spacing:3px;
  line-height:1;
  text-shadow:0 0 18px rgba(84,216,255,.20);
}

.video-description{
  max-width:720px;
  margin:0;
  color:#c6e5f2;
  font-size:19px;
  line-height:1.65;
}

/* Pouze existující 55.png — žádný jiný symbol */
.video-projector{
  position:absolute;
  z-index:1;

  right:4vw;
  top:50%;
  transform:translateY(-50%);

  width:min(560px,43vw);
  height:min(560px,43vw);

  background-image:url('/assets/backgrounds/video-projector.png');
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;

  opacity:.38;

  filter:
    grayscale(1)
    sepia(.18)
    hue-rotate(155deg)
    saturate(1.35)
    brightness(1.20)
    drop-shadow(0 0 8px rgba(86,205,238,.42))
    drop-shadow(0 0 20px rgba(86,205,238,.20));

  pointer-events:none;
}

/* Výslovně žádné pseudo-elementy */
.video-stage::before,
.video-stage::after,
.video-content::before,
.video-content::after{
  content:none !important;
  display:none !important;
}

@media(max-width:900px){
  .video-stage{
    min-height:650px;
    padding:55px 30px;
  }

  .video-title{
    font-size:48px;
  }

  .video-projector{
    width:360px;
    height:360px;
    right:-70px;
    opacity:.14;
  }
}

</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <img src="/assets/brand/LOGO_WEB.png"
         alt="GSC-X Command Center"
         class="brand-logo-web">
  </div>

  <nav class="nav">
    <a href="index.html">OVERVIEW</a>
    <a href="about.html">ABOUT</a>
    <a href="services.html">SERVICES</a>
    <a href="technology.html">TECHNOLOGY</a>
    <a href="sandboxes.html">SANDBOXES</a>
    <a href="publications.html">PUBLICATIONS</a>
    <a href="validation.html">VALIDATION</a>
    <a href="reports.html">REPORTS</a>
    <a href="repository.html">REPOSITORY</a>
    <a href="video.html" class="active">VIDEO</a>
    <a href="author.html">AUTHOR</a>
    <a href="contact.html">CONTACT</a>
    <a href="cs/video.html">🇨🇿 CZ</a>
  </nav>
</header>

<main class="video-stage">

  <div class="video-content">

    <div class="video-eyebrow">
      GSC-X · VIDEO PRESENTATIONS
    </div>

    <h1 class="video-title">
      GSC-X VIDEO
    </h1>

    <p class="video-description">
      Video presentations of the GSC-X project, Executive Kernel,
      validation environments and ongoing technology development.
    </p>

  </div>

  <div class="video-projector" aria-hidden="true"></div>

</main>

</body>
</html>
