body{

  letter-spacing:.16em;
  font-size:14px;

.video-title{

  font-family:Impact,"Arial Black",sans-serif;

@media(max-width:900px){

  }

  .video-projector{
    width:360px;
    height:360px;
    right:-70px;

  }
}

</style>









<style id="gscx-css-filmstrip">

.video-stage{
  position:relative;
  overflow:hidden;
}

/* dlouhý zatočený filmový pás */
.video-stage::before{
  content:"";
  position:absolute;

  right:-40px;
  top:54%;

  width:760px;
  height:330px;

  transform:
    translateY(-50%)
    rotate(-6deg);

  border:2px solid rgba(35,95,105,.18);
  border-left-color:transparent;
  border-radius:52% 48% 58% 42% / 36% 64% 40% 60%;

  box-shadow:
    inset 0 0 0 18px rgba(35,95,105,.025),
    0 0 8px rgba(35,95,105,.02);

  opacity:.34;

  pointer-events:none;
  z-index:0;
}

/* perforace + políčka filmu */
.video-stage::after{
  content:"";
  position:absolute;

  right:-12px;
  top:54%;

  width:700px;
  height:285px;

  transform:
    translateY(-50%)
    rotate(-6deg);

  border-radius:52% 48% 58% 42% / 36% 64% 40% 60%;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 42px,
      rgba(35,95,105,.11) 42px 44px,
      transparent 44px 92px
    );

  box-shadow:
    inset 0 16px 0 rgba(35,95,105,.055),
    inset 0 -16px 0 rgba(35,95,105,.055);

  opacity:.30;

  pointer-events:none;
  z-index:0;
}

.video-content{
  position:relative;
  z-index:2;
}

.video-content::before,
.video-content::after{
  content:none !important;
  display:none !important;
}

</style>

</head>
