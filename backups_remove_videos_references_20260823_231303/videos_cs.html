<style id="gscx-video-projector">
body{
  background:#01070b !important;
}

main{
  position:relative;
  min-height:720px;
  overflow:hidden;
  background:transparent !important;
}

main::after{
  content:"";
  position:absolute;
  right:10%;
  top:28%;
  width:360px;
  height:360px;

  background-image:url('/assets/backgrounds/video-bg.png');
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;

  opacity:.18;

  filter:
    grayscale(1)
    brightness(1.35)
    sepia(.10)
    hue-rotate(165deg)
    saturate(.55);

  pointer-events:none;
  z-index:0;
}

main > *{
  position:relative;
  z-index:1;
}
</style>
