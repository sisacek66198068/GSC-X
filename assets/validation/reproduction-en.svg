<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img"><title>100% reproduction of results across validated domains</title>
<defs>
  <clipPath id="domain-disc"><circle r="10"/></clipPath>
  <style>
    .signal-rays {
      fill: none;
      stroke: #60eca3;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .domain-fill { fill: #087445; }
    .domain-ring { fill: none; stroke: #60eca3; }
    @media (prefers-reduced-motion: no-preference) {
      .signal-rays path {
        stroke-dasharray: 1;
        animation: trace-ray 850ms ease-out both;
      }
      .domain-fill {
        transform-box: fill-box;
        transform-origin: left center;
        animation: fill-domain 550ms 850ms ease-in-out both;
      }
      .domain-ring { animation: light-ring 550ms 850ms ease-in both; }
    }
    @keyframes trace-ray { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fill-domain { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes light-ring { from { opacity: 0; } to { opacity: 1; } }
  </style>
</defs>
